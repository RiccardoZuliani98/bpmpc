[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpmpc"
version = "0.1.0"
description = "Parametric MPC builder on JAX"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "optax",
    "jaxsparrow @ git+https://github.com/RiccardoZuliani98/jaxsparrow.git@main",
]

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib"]
dev = ["pytest", "matplotlib"]

# ── Hatch build config ──────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/bpmpc"]

[tool.hatch.metadata]
allow-direct-references = true

# ── Pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]